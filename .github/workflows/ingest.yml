name: Collect news
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: collect-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger the collector
        env:
          BASE_URL: ${{ secrets.DEVFLASH_BASE_URL }}
          TOKEN: ${{ secrets.INGESTION_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$BASE_URL" == https://* && -n "$TOKEN" ]]
          curl --fail-with-body --silent --show-error --connect-timeout 20 --max-time 300 \
            --retry 1 --retry-delay 15 --proto '=https' --request POST \
            --header "Authorization: Bearer $TOKEN" "${BASE_URL%/}/api/v1/internal/ingestion/run" |
            jq -e '.data | if .errors == 0 then . else error("An import failed. Check the newsroom ingestion history.") end'
