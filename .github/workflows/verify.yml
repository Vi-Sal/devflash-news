name: Verify DevFlash
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: devflash_test
          POSTGRES_USER: devflash
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/devflash_test
      DB_USERNAME: devflash
      DB_PASSWORD: ''
      DEVFLASH_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/devflash_test
      DEVFLASH_TEST_DB_USERNAME: devflash
      DEVFLASH_TEST_DB_PASSWORD: ''
      DEVFLASH_ADMIN_TEST_DB: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm audit --audit-level=high && npm run build && npx playwright install --with-deps chromium && npm test
        working-directory: frontend
      - run: mvn --batch-mode -f backend/pom.xml verify
      - run: docker build -t devflash:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devflash:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
